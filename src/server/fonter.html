<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Converter</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0d0d1a;
            color: #eee;
            font-family: Arial, sans-serif;
            padding: 15px;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7);
        }
        h1 {
            text-align: center;
            color: #e94560;
            margin-top: 0;
            font-size: 28px;
        }
        .sub {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #2a2a4a;
            background: #0a0a1a;
            color: #eee;
            font-size: 18px;
            resize: vertical;
            min-height: 80px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
            margin: 15px 0;
            max-height: 280px;
            overflow-y: auto;
            padding: 5px;
            background: #12122a;
            border-radius: 10px;
            border: 1px solid #2a2a4a;
        }
        .style-grid button {
            padding: 6px 4px;
            border: 2px solid transparent;
            border-radius: 6px;
            background: #1a1a3a;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .style-grid button:hover {
            background: #2a2a5a;
            border-color: #555;
        }
        .style-grid button.active {
            border-color: #e94560;
            background: #2a1a3a;
            color: #fff;
            box-shadow: 0 0 20px rgba(233,69,96,0.2);
        }
        .style-grid button .preview {
            display: block;
            font-size: 20px;
            line-height: 1.4;
        }
        .style-grid button .label {
            font-size: 10px;
            color: #888;
            display: block;
            margin-top: 2px;
        }
        .output-box {
            background: #0a0a1a;
            padding: 18px;
            border-radius: 10px;
            border: 2px solid #2a2a4a;
            min-height: 70px;
            font-size: 26px;
            word-break: break-all;
            line-height: 1.8;
            margin-top: 5px;
        }
        .output-box:empty::before {
            content: "Result will appear here...";
            color: #444;
            font-size: 16px;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #2a2a5a;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            flex: 1;
            min-width: 100px;
        }
        .actions button:hover {
            background: #e94560;
            transform: scale(1.02);
        }
        .actions .copy-btn {
            background: #2ecc71;
        }
        .actions .copy-btn:hover {
            background: #27ae60;
        }
        .stats {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 12px;
        }
        .stats span {
            color: #e94560;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #12122a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a6a;
            border-radius: 10px;
        }
        @media (max-width: 600px) {
            .style-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                max-height: 200px;
            }
            .style-grid button .preview {
                font-size: 16px;
            }
            .output-box {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="sub">40+ styles — type below and click any style</div>

    <div class="style-grid" id="styleGrid"></div>

    <div class="output-box" id="outputText"></div>

    <div class="actions">
        <button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>
        <button onclick="resetText()">🔄 Reset</button>

        { id: 'bolditalic', label: 'Bold Italic', preview: '𝘽𝙤𝙡𝙙' },
        { id: 'script', label: 'Script', preview: '𝓢𝓬𝓻𝓲𝓹𝓽' },
        { id: 'cursive', label: 'Cursive', preview: '𝒞𝓊𝓇𝓈𝒾𝓋ℯ' },
        { id: 'mono', label: 'Monospace', preview: '𝙼𝚘𝚗𝚘' },
        { id: 'double', label: 'Double Struck', preview: '𝔻𝕠𝕦𝕓𝕝𝕖' },
        { id: 'sans', label: 'Sans', preview: '𝖲𝖺𝗇𝗌' },
        { id: 'sansbold', label: 'Sans Bold', preview: '𝗦𝗮𝗻𝘀' },
        { id: 'sansitalic', label: 'Sans Italic', preview: '𝘚𝘢𝘯𝘴' },
        { id: 'fraktur', label: 'Fraktur', preview: '𝔉𝔯𝔞𝔨𝔱𝔲𝔯' },
        { id: 'frakturbold', label: 'Fraktur Bold', preview: '𝕱𝖗𝖆𝖐𝖙𝖚𝖗' },
        { id: 'smallcaps', label: 'Small Caps', preview: 'Sᴍᴀʟʟ' },
        { id: 'fullwidth', label: 'Fullwidth', preview: 'Ｆｕｌｌ' },
        { id: 'circled', label: 'Circled', preview: 'ⓒⓘⓡⓒⓛⓔⓓ' },
        { id: 'paren', label: 'Parenthesis', preview: '🄹🄾🄺🄴' },
        { id: 'squared', label: 'Squared', preview: '🅂🅀🅄' },
        { id: 'blacksquared', label: 'Black Sq.', preview: '🅱🅻🅰🅲🅺' },
        { id: 'regional', label: 'Regional', preview: '🇫🇱🇦🇬' },
        { id: 'sub', label: 'Subscript', preview: 'ₛᵤᵦ' },
        { id: 'sup', label: 'Superscript', preview: 'ˢᵘᵖ' },
        { id: 'gothic', label: 'Gothic', preview: '𝕲𝖔𝖙𝖍𝖎𝖈' },
        { id: 'tilde', label: 'Tilde', preview: 'Ṫĩḷḋë' },
        { id: 'dotabove', label: 'Dot Above', preview: 'Ȯȧȧ' },
        { id: 'linebelow', label: 'Line Below', preview: 'A̲B̲C̲' },
        { id: 'lineabove', label: 'Line Above', preview: 'A̅B̅C̅' },
        { id: 'mathbold', label: 'Math Bold', preview: '𝐌𝐚𝐭𝐡' },
        { id: 'mathitalic', label: 'Math Italic', preview: '𝑀𝑎𝑡ℎ' },
        { id: 'mathbolditalic', label: 'Math Bold Italic', preview: '𝑴𝒂𝒕𝒉' },
        { id: 'mathsans', label: 'Math Sans', preview: '𝖬𝖺𝗍𝗁' },
        { id: 'mathsansbold', label: 'Math Sans Bold', preview: '𝗠𝗮𝘁𝗵' },
        { id: 'mathsansitalic', label: 'Math Sans Italic', preview: '𝘔𝘢𝘵𝘩' },
        { id: 'mathsansbolditalic', label: 'Math Sans Bold Italic', preview: '𝙈𝙖𝙩𝙝' },
        { id: 'mathmono', label: 'Math Mono', preview: '𝙼𝚊𝚝𝚑' },
        { id: 'blackletter', label: 'Blackletter', preview: '𝔅𝔩𝔞𝔠𝔨' },
        { id: 'greek', label: 'Greek', preview: 'ΑΒΓΔ' },
        { id: 'greekbold', label: 'Greek Bold', preview: '𝚨𝚩𝚪' },
        { id: 'cyrillic', label: 'Cyrillic', preview: 'АБВГ' },
        { id: 'hebrew', label: 'Hebrew', preview: 'אבגד' },
        { id: 'katakana', label: 'Katakana', preview: 'カタカナ' },
        { id: 'zalgo', label: 'Zalgo', preview: 'Z̴a̴l̴g̴o̴' }
    ];

    function convertText(text, styleId) {
        const map = FONTS[styleId] || FONTS.bold;
        let result = '';
        for (let char of text) {
            result += map[char] || char;
        }
        return result;
    }

    let currentStyle = 'bold';
    const inputEl = document.getElementById('inputText');
    const outputEl = document.getElementById('outputText');
    const gridEl = document.getElementById('styleGrid');
    const countEl = document.getElementById('styleCount');

    countEl.textContent = STYLE_LIST.length;

    STYLE_LIST.forEach(style => {
        const btn = document.createElement('button');
        btn.dataset.style = style.id;
        btn.innerHTML = `
            <span class="preview">${style.preview}</span>
            <span class="label">${style.label}</span>
        `;
        if (style.id === 'bold') btn.classList.add('active');
        btn.addEventListener('click', function() {
            document.querySelectorAll('.style-grid button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentStyle = this.dataset.style;
            updateOutput();
        });
        gridEl.appendChild(btn);
    });

    function updateOutput() {
        const text = inputEl.value || '';
        const converted = convertText(text, currentStyle);
        outputEl.textContent = converted;
    }

    inputEl.addEventListener('input', updateOutput);

    function copyResult() {
        const text = outputEl.textContent;
        if (!text) {
            alert('Text is empty!');
            return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => alert('✅ Copied! (' + text.length + ' chars)'))
                .catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            alert('✅ Copied!');
        } catch (e) {
            alert('❌ Copy failed. Please copy manually.');
        }
        document.body.removeChild(ta);
    }

    function resetText() {
        inputEl.value = '';
        outputEl.textContent = '';
        inputEl.focus();
    }

    updateOutput();

    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            copyResult();
        }
    });
</script>

</body>
