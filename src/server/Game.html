<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048</title>
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bg: #faf8ef;
            --container: #bbada0;
            --tile-bg: rgba(238, 228, 218, 0.35);
            --text: #776e65;
            --header: #776e65;
            --score-bg: #cdc1b4;
            --btn: #8f7a66;
            --btn-hover: #9f8b76;
            --shadow: rgba(0,0,0,0.2);
            --msg-bg: rgba(238, 228, 218, 0.5);
            --radius: 6px;
            --gap: 12px;
            --padding: 12px;
            --win-bg: #e8f5e9;
            --win-color: #3c9a6e;
            --gameover-bg: #ffebee;
            --gameover-color: #c62828;
        }

        [data-theme="dark"] {
            --bg: #1a1a2e;
            --container: #2d2d44;
            --tile-bg: rgba(255,255,255,0.08);
            --text: #e0e0e0;
            --header: #e0e0e0;
            --score-bg: #3d3d5c;
            --btn: #4a4a6a;
            --btn-hover: #5a5a7a;
            --shadow: rgba(0,0,0,0.5);
            --msg-bg: rgba(50,50,70,0.5);
            --win-bg: #1e3a2e;
            --win-color: #81c784;
            --gameover-bg: #3a1e1e;
            --gameover-color: #ef9a9a;
        }

        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.3s;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--container);
            border-radius: var(--radius);
            padding: var(--padding);
            box-shadow: 0 8px 40px var(--shadow);
            transition: all 0.3s;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--header);
            line-height: 1;
            transition: color 0.3s;
            letter-spacing: -1px;
        }
        .dark-toggle {
            background: var(--score-bg);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dark-toggle:hover { transform: scale(1.05); box-shadow: 0 2px 10px var(--shadow); }

        .scores {
            display: flex;
            gap: 8px;
        }
        .score-box {
            background: var(--score-bg);
            padding: 4px 14px;
            border-radius: var(--radius);
            text-align: center;
            min-width: 60px;
            transition: background 0.3s;
        }
        .score-box .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: var(--text);
            font-weight: 700;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }
        .score-box .value {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--header);
            line-height: 1.2;
            transition: color 0.3s;
        }

        /* ===== SETTINGS ===== */
        .settings {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            background: var(--tile-bg);
            padding: 8px 14px;
            border-radius: var(--radius);
            transition: background 0.3s;
        }
        .settings label {
            color: var(--text);
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .settings input[type="number"] {
            width: 50px;
            padding: 3px 4px;
            border-radius: var(--radius);
            border: 1px solid var(--text);
            background: var(--bg);
            color: var(--text);
            font-weight: 700;
            text-align: center;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .settings input[type="number"]:focus { outline: 2px solid var(--btn); }
        .settings .btn-sm {
            background: var(--btn);
            color: #f9f6f2;
            border: none;
            padding: 4px 16px;
            border-radius: var(--radius);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .settings .btn-sm:hover { background: var(--btn-hover); transform: scale(1.03); }

        /* ===== GRID ===== */
        .grid-wrapper {
            position: relative;
            background: var(--container);
            border-radius: var(--radius);
            padding: var(--padding);
            transition: background 0.3s;
            aspect-ratio: 1 / 1;
            width: 100%;
        }
        .grid {
            display: grid;
            gap: var(--gap);
            width: 100%;
            height: 100%;
            transition: all 0.2s;
        }
        .cell {
            background: var(--tile-bg);
            border-radius: var(--radius);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            color: var(--text);
            aspect-ratio: 1 / 1;
            user-select: none;
            transition: transform 0.1s ease, background 0.1s ease;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            word-break: break-all;
            /* اندازه فونت پیش‌فرض - با جاوااسکریپت تنظیم می‌شود */
            font-size: 2.2rem;
        }
        .cell.pop { animation: pop 0.15s ease; }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .cell.merged { animation: merge 0.2s ease; }
        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* ===== TILE COLORS ===== */
        .cell[data-value="2"] { background: #eee4da; color: #776e65; }
        .cell[data-value="4"] { background: #ede0c8; color: #776e65; }
        .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
        .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
        .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
        .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
        .cell[data-value="128"] { background: #edcf72; color: #f9f6f2; }
        .cell[data-value="256"] { background: #edcc61; color: #f9f6f2; }
        .cell[data-value="512"] { background: #edc850; color: #f9f6f2; }
        .cell[data-value="1024"] { background: #edc53f; color: #f9f6f2; }
        .cell[data-value="2048"] { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,0.4); }
        .cell[data-value="4096"] { background: #60d992; color: #f9f6f2; }
        .cell[data-value="8192"] { background: #3c9a6e; color: #f9f6f2; }

        [data-theme="dark"] .cell[data-value="2"] { background: #3d3d5c; color: #e0e0e0; }
        [data-theme="dark"] .cell[data-value="4"] { background: #4a4a6a; color: #e0e0e0; }
        [data-theme="dark"] .cell[data-value="8"] { background: #b27a5a; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="16"] { background: #b56a4a; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="32"] { background: #b85a3a; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="64"] { background: #b84a2a; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="128"] { background: #b8a052; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="256"] { background: #b89842; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="512"] { background: #b88832; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="1024"] { background: #b87822; color: #f9f6f2; }
        [data-theme="dark"] .cell[data-value="2048"] { background: #b86812; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(200,180,50,0.3); }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--btn);
            color: #f9f6f2;
            border: none;
            padding: 10px 28px;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn:hover { background: var(--btn-hover); transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }
        .btn:active { transform: scale(0.95); }

        /* ===== MESSAGE ===== */
        .message {
            text-align: center;
            margin-top: 14px;
            font-size: 0.95rem;
            min-height: 2.4em;
            color: var(--text);
            font-weight: 600;
            padding: 8px 16px;
            border-radius: var(--radius);
            background: var(--msg-bg);
            transition: all 0.3s;
        }
        .message.win { color: var(--win-color); background: var(--win-bg); }
        .message.gameover { color: var(--gameover-color); background: var(--gameover-bg); }

        /* ===== OVERLAY ===== */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(238, 228, 218, 0.73);
            border-radius: var(--radius);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: fadeIn 0.5s ease;
            backdrop-filter: blur(2px);
        }
        [data-theme="dark"] .overlay { background: rgba(26, 26, 46, 0.8); }
        .overlay.show { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .overlay .big-icon { font-size: 4rem; margin-bottom: 8px; }
        .overlay .big-text {
            font-size: 2.4rem;
            font-weight: 900;
            color: #776e65;
            text-align: center;
        }
        [data-theme="dark"] .overlay .big-text { color: #e0e0e0; }
        .overlay .sub-text {
            font-size: 1rem;
            color: #776e65;
            margin-top: 4px;
            opacity: 0.7;
        }
        [data-theme="dark"] .overlay .sub-text { color: #e0e0e0; }
        .overlay .btn {
            margin-top: 16px;
            padding: 10px 32px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 12px;
            color: var(--text);
            font-size: 0.7rem;
            opacity: 0.5;
            transition: color 0.3s;
            letter-spacing: 0.3px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .container { padding: 10px; }
            .title { font-size: 2.2rem; }
            .score-box { padding: 3px 10px; min-width: 50px; }
            .score-box .value { font-size: 1.1rem; }
            .settings { gap: 8px; padding: 6px 10px; }
            .settings label { font-size: 0.75rem; }
            .settings input[type="number"] { width: 42px; }
            :root { --gap: 8px; --padding: 8px; }
            .overlay .big-text { font-size: 1.8rem; }
            .overlay .big-icon { font-size: 3rem; }
            /* سایز فونت در موبایل با جاوااسکریپت تنظیم می‌شود */
        }
        @media (max-width: 400px) {
            :root { --gap: 6px; --padding: 6px; }
            .title { font-size: 1.8rem; }
        }
        @media (max-width: 350px) {
            .header { flex-direction: column; align-items: stretch; }
            .scores { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- HEADER -->
        <div class="header">
            <div class="title-section">
                <span class="title">2048</span>
                <button class="dark-toggle" id="darkToggle" aria-label="Toggle dark mode">🌙</button>
            </div>
            <div class="scores">
                <div class="score-box">
                    <div class="label">SCORE</div>
                    <div class="value" id="scoreDisplay">0</div>
                </div>
                <div class="score-box">
                    <div class="label">BEST</div>
                    <div class="value" id="bestDisplay">0</div>
                </div>
            </div>
        </div>

        <!-- SETTINGS -->
        <div class="settings">
            <label>
                SIZE
                <input type="number" id="sizeInput" value="4" min="3" max="8">
            </label>
            <button class="btn-sm" id="resizeBtn">RESIZE</button>
        </div>

        <!-- GRID -->
        <div class="grid-wrapper" id="gridWrapper">
            <div class="grid" id="gridContainer"></div>
            <!-- OVERLAY -->
            <div class="overlay" id="overlay">
                <div class="big-icon" id="overlayIcon">🎉</div>
                <div class="big-text" id="overlayTitle">You Win!</div>
                <div class="sub-text" id="overlaySub">Congratulations!</div>
                <button class="btn" id="overlayBtn">Play Again</button>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button class="btn" id="newGameBtn">🔄 New Game</button>
        </div>

        <!-- MESSAGE -->
        <div class="message" id="messageDisplay">✨ Join tiles to get 2048!</div>
        <div class="footer">⌨️ Arrow keys or 👆 Swipe</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== STATE =====
            const state = {
                grid: [],
                size: 4,
                score: 0,
                best: parseInt(localStorage.getItem('best2048')) || 0,
                gameOver: false,
                gameWon: false,
                darkMode: localStorage.getItem('darkMode2048') === 'true',
                keepPlaying: false,
                isAnimating: false
            };

            // ===== DOM REFS =====
            const gridContainer = document.getElementById('gridContainer');
            const gridWrapper = document.getElementById('gridWrapper');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const bestDisplay = document.getElementById('bestDisplay');
            const messageDisplay = document.getElementById('messageDisplay');
            const overlay = document.getElementById('overlay');
            const overlayIcon = document.getElementById('overlayIcon');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlaySub = document.getElementById('overlaySub');
            const overlayBtn = document.getElementById('overlayBtn');
            const sizeInput = document.getElementById('sizeInput');
            const darkToggle = document.getElementById('darkToggle');

            // ===== THEME =====
            function applyTheme() {
                if (state.darkMode) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    darkToggle.textContent = '☀️';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    darkToggle.textContent = '🌙';
                }
                localStorage.setItem('darkMode2048', state.darkMode);
            }
            darkToggle.addEventListener('click', () => {
                state.darkMode = !state.darkMode;
                applyTheme();
            });

            // ===== HELPERS =====
            function updateBest() {
                if (state.score > state.best) {
                    state.best = state.score;
                    localStorage.setItem('best2048', state.best);
                }
                bestDisplay.textContent = state.best;
            }

            function updateScore() {
                scoreDisplay.textContent = state.score;
                updateBest();
            }

            function setMessage(text, type = '') {
                messageDisplay.textContent = text;
                messageDisplay.className = 'message' + (type ? ' ' + type : '');
            }

            function showOverlay(icon, title, sub) {
                overlayIcon.textContent = icon;
                overlayTitle.textContent = title;
                overlaySub.textContent = sub;
                overlay.classList.add('show');
            }

            function hideOverlay() {
                overlay.classList.remove('show');
            }

            // ===== GRID =====
            function createEmptyGrid(size) {
                return Array.from({ length: size }, () => Array(size).fill(0));
            }

            function initGrid(size) {
                state.size = size;
                state.grid = createEmptyGrid(size);
                state.score = 0;
                state.gameOver = false;
                state.gameWon = false;
                state.keepPlaying = false;
                state.isAnimating = false;
                hideOverlay();
                addRandomTile();
                addRandomTile();
                renderGrid();
                updateScore();
                setMessage('✨ Join tiles to get 2048!');
            }

            function getEmptyCells() {
                const empty = [];
                for (let r = 0; r < state.size; r++) {
                    for (let c = 0; c < state.size; c++) {
                        if (state.grid[r][c] === 0) empty.push({ row: r, col: c });
                    }
                }
                return empty;
            }

            function addRandomTile() {
                const empty = getEmptyCells();
                if (empty.length === 0) return false;
                const { row, col } = empty[Math.floor(Math.random() * empty.length)];
                state.grid[row][col] = Math.random() < 0.9 ? 2 : 4;
                return { row, col };
            }

            // ===== MOVEMENT =====
            function moveLeft() {
                let moved = false;
                const mergedCells = [];
                for (let r = 0; r < state.size; r++) {
                    const row = state.grid[r].filter(v => v !== 0);
                    const merged = [];
                    for (let i = 0; i < row.length; i++) {
                        if (i + 1 < row.length && row[i] === row[i + 1]) {
                            const val = row[i] * 2;
                            merged.push(val);
                            state.score += val;
                            mergedCells.push({ row: r, col: merged.length - 1 });
                            i++;
                        } else {
                            merged.push(row[i]);
                        }
                    }
                    while (merged.length < state.size) merged.push(0);
                    if (state.grid[r].join(',') !== merged.join(',')) moved = true;
                    state.grid[r] = merged;
                }
                return { moved, mergedCells };
            }

            function moveRight() {
                reverseRows();
                const result = moveLeft();
                reverseRows();
                result.mergedCells = result.mergedCells.map(c => ({ row: c.row, col: state.size - 1 - c.col }));
                return result;
            }

            function moveUp() {
                transpose();
                const result = moveLeft();
                transpose();
                result.mergedCells = result.mergedCells.map(c => ({ row: c.col, col: c.row }));
                return result;
            }

            function moveDown() {
                transpose();
                const result = moveRight();
                transpose();
                result.mergedCells = result.mergedCells.map(c => ({ row: c.col, col: c.row }));
                return result;
            }

            function reverseRows() {
                for (let r = 0; r < state.size; r++) state.grid[r].reverse();
            }

            function transpose() {
                const newGrid = createEmptyGrid(state.size);
                for (let r = 0; r < state.size; r++) {
                    for (let c = 0; c < state.size; c++) {
                        newGrid[c][r] = state.grid[r][c];
                    }
                }
                state.grid = newGrid;
            }

            // ===== GAME OVER / WIN CHECK =====
            function isGameOver() {
                if (getEmptyCells().length > 0) return false;
                for (let r = 0; r < state.size; r++) {
                    for (let c = 0; c < state.size - 1; c++) {
                        if (state.grid[r][c] === state.grid[r][c + 1]) return false;
                    }
                }
                for (let r = 0; r < state.size - 1; r++) {
                    for (let c = 0; c < state.size; c++) {
                        if (state.grid[r][c] === state.grid[r + 1][c]) return false;
                    }
                }
                return true;
            }

            function hasWon() {
                for (let r = 0; r < state.size; r++) {
                    for (let c = 0; c < state.size; c++) {
                        if (state.grid[r][c] === 2048) return true;
                    }
                }
                return false;
            }

            // ===== تنظیم اندازه فونت بر اساس مقدار و اندازه گرید =====
            function getFontSize(value, gridSize) {
                const digits = String(value).length;
                // اندازه پایه با توجه به سایز گرید
                let baseSize;
                if (gridSize <= 4) {
                    baseSize = 2.2;
                } else if (gridSize <= 5) {
                    baseSize = 1.8;
                } else if (gridSize <= 6) {
                    baseSize = 1.4;
                } else {
                    baseSize = 1.1;
                }

                // کاهش فونت بر اساس تعداد رقم‌ها
                if (digits <= 2) {
                    return baseSize + 'rem';
                } else if (digits === 3) {
                    return (baseSize * 0.75) + 'rem';
                } else if (digits === 4) {
                    return (baseSize * 0.55) + 'rem';
                } else {
                    return (baseSize * 0.4) + 'rem';
                }
            }

            // ===== MAIN MOVE =====
            function makeMove(direction) {
                if (state.gameOver || state.isAnimating) {
                    if (state.gameOver) setMessage('💔 Game Over! Press "New Game"', 'gameover');
                    return;
                }

                let result;
                try {
                    switch (direction) {
                        case 'left': result = moveLeft(); break;
                        case 'right': result = moveRight(); break;
                        case 'up': result = moveUp(); break;
                        case 'down': result = moveDown(); break;
                        default: return;
                    }
                } catch (e) {
                    console.error('Move error:', e);
                    return;
                }

                if (result.moved) {
                    state.isAnimating = true;
                    const added = addRandomTile();
                    updateScore();

                    // Render with animations
                    renderGrid(result.mergedCells, added);

                    // Check win
                    if (hasWon() && !state.gameWon && !state.keepPlaying) {
                        state.gameWon = true;
                        setTimeout(() => {
                            showOverlay('🎉', 'You Win!', 'You reached 2048!');
                            setMessage('🎉 You Win! Press "Keep Going" or "New Game"', 'win');
                            state.isAnimating = false;
                        }, 200);
                        return;
                    }

                    // Check game over
                    if (isGameOver()) {
                        state.gameOver = true;
                        setTimeout(() => {
                            showOverlay('💔', 'Game Over!', 'Try again!');
                            setMessage('💔 Game Over! Press "New Game"', 'gameover');
                            state.isAnimating = false;
                        }, 200);
                        return;
                    }

                    setMessage('👍 Keep going!');
                    setTimeout(() => {
                        state.isAnimating = false;
                    }, 200);
                } else {
                    setMessage('⛔ Cannot move that way');
                }
            }

            // ===== RENDER =====
            function renderGrid(mergedCells = [], addedCell = null) {
                try {
                    gridContainer.style.gridTemplateColumns = `repeat(${state.size}, 1fr)`;
                    gridContainer.innerHTML = '';
                    
                    // تشخیص سایز صفحه برای تنظیم بهتر
                    const isMobile = window.innerWidth <= 520;
                    
                    for (let r = 0; r < state.size; r++) {
                        for (let c = 0; c < state.size; c++) {
                            const cell = document.createElement('div');
                            cell.className = 'cell';
                            const value = state.grid[r][c];
                            cell.dataset.value = value;
                            cell.textContent = value || '';

                            // تنظیم اندازه فونت بر اساس مقدار و سایز گرید
                            if (value !== 0) {
                                let fontSize = getFontSize(value, state.size);
                                // در موبایل کمی بزرگتر نمایش داده شود
                                if (isMobile) {
                                    const currentSize = parseFloat(fontSize);
                                    fontSize = Math.min(currentSize * 1.2, 2.5) + 'rem';
                                }
                                cell.style.fontSize = fontSize;
                            }

                            // Check if this cell was merged
                            const isMerged = mergedCells.some(m => m.row === r && m.col === c);
                            if (isMerged && value !== 0) {
                                cell.classList.add('merged');
                            }

                            // Check if this cell was just added
                            if (addedCell && addedCell.row === r && addedCell.col === c && value !== 0) {
                                cell.classList.add('pop');
                            }

                            gridContainer.appendChild(cell);
                        }
                    }
                } catch (e) {
                    console.error('Render error:', e);
                }
            }

            // ===== NEW GAME =====
            function newGame() {
                const size = parseInt(sizeInput.value) || 4;
                if (size < 3 || size > 8) {
                    setMessage('⚠️ Size must be between 3 and 8', 'gameover');
                    return;
                }
                state.keepPlaying = false;
                state.isAnimating = false;
                initGrid(size);
                hideOverlay();
            }

            // ===== KEEP PLAYING =====
            function keepPlaying() {
                state.keepPlaying = true;
                state.gameWon = false;
                state.isAnimating = false;
                hideOverlay();
                setMessage('👍 Keep going! Try for higher!');
                if (isGameOver()) {
                    state.gameOver = true;
                    showOverlay('💔', 'Game Over!', 'Try again!');
                    setMessage('💔 Game Over! Press "New Game"', 'gameover');
                }
            }

            // ===== EVENTS =====
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                    e.preventDefault();
                    const dir = key.replace('Arrow', '').toLowerCase();
                    makeMove(dir);
                }
            });

            // Touch / Swipe
            let touchStartX = 0, touchStartY = 0;
            let isTouching = false;
            
            gridWrapper.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                isTouching = true;
            }, { passive: true });

            gridWrapper.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });

            gridWrapper.addEventListener('touchend', (e) => {
                if (!isTouching) return;
                isTouching = false;
                try {
                    const touchEnd = e.changedTouches[0];
                    const dx = touchEnd.clientX - touchStartX;
                    const dy = touchEnd.clientY - touchStartY;
                    const absDx = Math.abs(dx);
                    const absDy = Math.abs(dy);
                    if (Math.max(absDx, absDy) < 20) return;
                    if (absDx > absDy) {
                        makeMove(dx > 0 ? 'right' : 'left');
                    } else {
                        makeMove(dy > 0 ? 'down' : 'up');
                    }
                } catch (err) {
                    // ignore
                }
            }, { passive: true });

            // Buttons
            document.getElementById('newGameBtn').addEventListener('click', newGame);
            document.getElementById('resizeBtn').addEventListener('click', newGame);
            overlayBtn.addEventListener('click', () => {
                if (state.gameOver) {
                    newGame();
                } else if (state.gameWon) {
                    keepPlaying();
                } else {
                    newGame();
                }
            });

            // Enter key for resize
            sizeInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') newGame(); });

            // ===== INIT =====
            applyTheme();
            bestDisplay.textContent = state.best;
            sizeInput.value = state.size;
            initGrid(state.size);

            // ===== HANDLE WINDOW RESIZE =====
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    renderGrid();
                }, 100);
            });

        })();
    </script>
</body>
</html>
